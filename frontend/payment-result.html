<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status pembayaran — ChatGVTL</title><link rel="stylesheet" href="css/core/reset.css"><link rel="stylesheet" href="css/core/variables.css"><link rel="stylesheet" href="css/core/typography.css"><link rel="stylesheet" href="css/core/global.css"><link rel="stylesheet" href="css/pages/auth.css"></head><body><main class="auth-page"><section class="auth-card"><span class="auth-kicker">PAYMENTS</span><h1>Status pembayaran</h1><p id="description">Memeriksa transaksi ChatGVTL…</p><p class="auth-status" id="result"></p><button class="auth-primary" id="complete" type="button" hidden>Simulasikan pembayaran berhasil</button><a class="auth-secondary" href="subscription.html">Kembali ke langganan</a></section></main><script src="js/ui/api.js"></script><script>(async()=>{const p=new URLSearchParams(location.search),order=p.get('order'),result=document.getElementById('result'),desc=document.getElementById('description'),btn=document.getElementById('complete');if(!order){result.textContent='Order tidak ditemukan.';return;}result.textContent=`Order: ${order}`;const isMock=(localStorage.getItem('chatgvtl_token')||'')&&location.protocol!=='https:';if(isMock){btn.hidden=false;btn.onclick=async()=>{btn.disabled=true;try{const d=await window.ChatGVTL.api.request('/payments/mock/complete',{method:'POST',body:JSON.stringify({orderId:order})});desc.textContent='Pembayaran simulasi berhasil.';result.textContent=`Paket ${d.subscription.plan.toUpperCase()} sekarang aktif.`;btn.hidden=true;}catch(e){btn.disabled=false;result.textContent=e.message||'Gagal menyelesaikan pembayaran.';}};}})();</script><script src="js/ui/api.js"></script><script src="js/ui/auth-guard.js"></script>
</body></html>
